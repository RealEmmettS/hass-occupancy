name: Occupancy Test Journal
version: "1.0.6"
slug: occupancy_journal
description: Read-only occupancy forecast, presence, and cooling history with timestamped exports.
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_title: Occupancy history
panel_icon: mdi:chart-timeline-variant
watchdog: http://[HOST]:[PORT:8099]/health
options:
  retention_days: 90
  forecast_addon: ""
  residents: []
  extra_entities: []
schema:
  retention_days: int(30,365)
  forecast_addon: str
  residents:
    - name: str
      entity_id: str
      forecast: bool
  extra_entities:
    - str
